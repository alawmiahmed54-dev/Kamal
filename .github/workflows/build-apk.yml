
name: Build Kamal APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract project ZIP
        run: |
          unzip -q Kamal_GitHub_Project.zip -d extracted
          test -f extracted/KamalProject/settings.gradle
          test -f extracted/KamalProject/app/build.gradle

      - name: Build APK
        working-directory: extracted/KamalProject
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kamal-debug-apk
          path: extracted/KamalProject/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
